<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国车牌查询表</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --text-secondary: #666666;
      --card-bg: #f9f9f9;
      --card-border: #dddddd;
      --input-bg: #ffffff;
      --input-border: #cccccc;
      --input-focus: #28a745;
      --button-bg: #28a745;
      --button-hover: #218838;
      --shadow: rgba(0, 0, 0, 0.1);
      --tag-bg: #e9ecef;
      --tag-active-bg: #28a745;
      --tag-active-color: #ffffff;
      --plate-bg: #ffffff;
      --plate-blue: #0033a0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --text-color: #ffffff;
        --text-secondary: #cccccc;
        --card-bg: #2d2d2d;
        --card-border: #555555;
        --input-bg: #3a3a3a;
        --input-border: #555555;
        --input-focus: #34ce57;
        --button-bg: #28a745;
        --button-hover: #34ce57;
        --shadow: rgba(0, 0, 0, 0.3);
        --tag-bg: #3a3a3a;
        --tag-active-bg: #28a745;
        --tag-active-color: #ffffff;
        --plate-bg: #2d2d2d;
        --plate-blue: #1e5fbf;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      color: var(--text-color);
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 25px;
    }

    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      font-size: 1.1em;
      border: 2px solid var(--input-border);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: var(--text-color);
      transition: border-color 0.2s ease, background-color 0.3s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--input-focus);
    }

    .search-box .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3em;
      color: var(--text-secondary);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .filter-tag {
      padding: 6px 14px;
      background: var(--tag-bg);
      color: var(--text-color);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      font-size: 0.95em;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
      user-select: none;
    }

    .filter-tag:hover {
      background: var(--button-bg);
      color: var(--tag-active-color);
    }

    .filter-tag.active {
      background: var(--tag-active-bg);
      color: var(--tag-active-color);
      border-color: var(--tag-active-bg);
    }

    .result-count {
      color: var(--text-secondary);
      margin-bottom: 15px;
      font-size: 0.95em;
    }

    .province-section {
      margin-bottom: 30px;
    }

    .province-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--button-bg);
    }

    .province-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: var(--plate-blue);
      color: #ffffff;
      font-size: 1.6em;
      font-weight: bold;
      border-radius: 6px;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px var(--plate-blue);
    }

    .province-name {
      font-size: 1.4em;
      font-weight: bold;
      color: var(--text-color);
    }

    .province-region {
      color: var(--text-secondary);
      font-size: 0.9em;
      margin-left: 8px;
    }

    .plate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .plate-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.3s ease;
      cursor: pointer;
    }

    .plate-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px var(--shadow);
    }

    .plate-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      height: 36px;
      padding: 0 6px;
      background: var(--plate-blue);
      color: #ffffff;
      font-size: 1.2em;
      font-weight: bold;
      border-radius: 4px;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px var(--plate-blue);
      white-space: nowrap;
      font-family: 'Courier New', monospace;
    }

    .plate-info {
      flex: 1;
      min-width: 0;
    }

    .plate-city {
      font-weight: bold;
      color: var(--text-color);
      font-size: 1.05em;
    }

    .plate-note {
      color: var(--text-secondary);
      font-size: 0.85em;
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state .icon {
      font-size: 3em;
      margin-bottom: 15px;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--button-bg);
      color: white;
      padding: 12px 28px;
      border-radius: 5px;
      font-size: 1em;
      font-weight: bold;
      box-shadow: 0 4px 12px var(--shadow);
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: var(--button-bg);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .back-link:hover {
      background: var(--button-hover);
    }

    .info-section {
      margin-top: 30px;
      padding: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .info-section h3 {
      margin-top: 0;
      color: var(--text-color);
    }

    .info-section ul {
      color: var(--text-secondary);
      line-height: 1.8;
    }

    .back-wrap {
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 2em;
      }

      .plate-grid {
        grid-template-columns: 1fr;
      }

      .filter-bar {
        gap: 6px;
      }

      .filter-tag {
        padding: 5px 10px;
        font-size: 0.85em;
      }
    }
  </style>
</head>

    <ul>

      <li>点击顶部标签可按地区分类筛选</li>
      <li>点击任意车牌卡片可复制完整代号</li>
      <li>部分直辖市/自治州的字母按用途或区域划分，可能与具体城市非一一对应</li>
      <li>数据供参考，个别地区代号可能因行政区划调整而变化</li>
    </ul>
  </div>

    const searchInput = document.getElementById('search-input');

    const resultCount = document.getElementById('result-count');

    // 地区分组
    const regionGroups = {
      '全部': null,
      '直辖市': ['北京', '天津', '上海', '重庆'],
      '华北': ['河北', '山西', '内蒙古'],
      '东北': ['辽宁', '吉林', '黑龙江'],
      '华东': ['江苏', '浙江', '安徽', '福建', '江西', '山东'],
      '华中': ['河南', '湖北', '湖南'],
      '华南': ['广东', '海南', '广西'],
      '西南': ['四川', '贵州', '云南', '西藏'],
      '西北': ['陕西', '甘肃', '青海', '宁夏', '新疆']
    };

    // 渲染筛选标签
    function renderFilters() {
      filterBar.innerHTML = '';
      Object.keys(regionGroups).forEach(region => {
        const tag = document.createElement('span');
        tag.className = 'filter-tag' + (region === activeRegion ? ' active' : '');
        tag.textContent = region;
        tag.onclick = () => {
          activeRegion = region;
          renderFilters();
          render();
        };
        filterBar.appendChild(tag);
      });
    }

    // 过滤数据
    function filterData() {
      const keyword = searchInput.value.trim().toLowerCase();
      let filtered = plateData;

      // 按地区筛选
      if (activeRegion !== '全部' && regionGroups[activeRegion]) {
        const allowed = regionGroups[activeRegion];
        filtered = filtered.filter(p => allowed.includes(p.province));
      }

      // 按关键词筛选
      if (keyword) {
        filtered = filtered.map(p => {
          // 优先匹配省份：若命中则显示该省全部代号
          const matchProvince = p.province.toLowerCase().includes(keyword) ||
            p.prefix.toLowerCase().includes(keyword) ||
            p.region.toLowerCase().includes(keyword);
          if (matchProvince) {
            return p;
          }
          // 否则按城市名/字母代号/完整代号过滤
          const matchedCities = p.cities.filter(c =>
            c.city.toLowerCase().includes(keyword) ||
            c.code.toLowerCase() === keyword ||
            (p.prefix + c.code).toLowerCase() === keyword
          );
          if (matchedCities.length > 0) {
            return { ...p, cities: matchedCities };
          }
          return null;
        }).filter(p => p !== null);
      }

      return filtered;
    }

    // 渲染
    function render() {
      const data = filterData();

      // 统计
      let totalCards = 0;
      data.forEach(p => totalCards += p.cities.length);
      resultCount.textContent = `共 ${data.length} 个省/区/市，${totalCards} 条车牌代号`;

      if (data.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <div>未找到匹配的车牌信息</div>
          </div>`;
        return;
      }

      let html = '';
      data.forEach(p => {
        let cards = '';
        p.cities.forEach(c => {
          const fullCode = p.prefix + c.code;
          cards += `
            <div class="plate-card" onclick="copyCode('${fullCode}')">
              <span class="plate-badge">${fullCode}</span>
              <div class="plate-info">
                <div class="plate-city">${c.city}</div>
                <div class="plate-note">${p.province}</div>
              </div>
            </div>`;
        });
        html += `
          <div class="province-section">
            <div class="province-header">
              <span class="province-prefix">${p.prefix}</span>
              <span class="province-name">${p.province}</span>
              <span class="province-region">${p.region}</span>
            </div>
            <div class="plate-grid">${cards}</div>
          </div>`;
      });
      container.innerHTML = html;
    }

    // 复制
    function copyCode(code) {
      const textarea = document.createElement('textarea');
      textarea.value = code;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('已复制：' + code);
      } catch (e) {
        showToast('复制失败');
      }
      document.body.removeChild(textarea);
    }

    // Toast
    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    searchInput.addEventListener('input', render);

    renderFilters();
    render();
  </script>
