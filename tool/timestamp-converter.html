<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间戳转换工具</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --text-secondary: #666666;
      --card-bg: #f9f9f9;
      --card-border: #dddddd;
      --button-bg: #28a745;
      --button-hover: #218838;
      --shadow: rgba(0, 0, 0, 0.1);
      --input-bg: #ffffff;
      --input-border: #dddddd;
      --result-bg: #e8f5e9;
      --result-border: #c3e6cb;
      --info-bg: #fff3cd;
      --info-border: #ffc107;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --text-color: #ffffff;
        --text-secondary: #cccccc;
        --card-bg: #2d2d2d;
        --card-border: #555555;
        --button-bg: #28a745;
        --button-hover: #34ce57;
        --shadow: rgba(0, 0, 0, 0.3);
        --input-bg: #3a3a3a;
        --input-border: #555555;
        --result-bg: #1e4620;
        --result-border: #2d5f2e;
        --info-bg: #3a3420;
        --info-border: #6a5a20;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      color: var(--text-color);
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 30px;
      font-size: 0.95em;
    }

    .current-time {
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.1em;
    }

    .current-time .label {
      color: var(--text-secondary);
      font-size: 0.9em;
      margin-bottom: 5px;
    }

    .current-time .value {
      font-weight: 600;
      color: var(--text-color);
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      display: inline-block;
      position: relative;
    }

    .copy-btn {
      display: inline-block;
      margin-left: 10px;
      padding: 4px 12px;
      background: var(--button-bg);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 0.85em;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .copy-btn:hover {
      background: var(--button-hover);
    }

    .copy-btn:active {
      transform: scale(0.95);
    }

    .calculator-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 4px var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .calculator-card h2 {
      margin: 0 0 15px 0;
      color: var(--text-color);
      font-size: 1.1em;
      font-weight: 600;
    }

    .calc-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .calc-row input[type="text"],
    .calc-row input[type="number"],
    .calc-row input[type="datetime-local"],
    .calc-row select {
      padding: 8px 12px;
      font-size: 0.95em;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
      transition: border-color 0.2s ease;
      flex: 1;
      min-width: 200px;
    }

    .calc-row input:focus,
    .calc-row select:focus {
      outline: none;
      border-color: var(--button-bg);
    }

    .calc-row select {
      flex: 0 0 auto;
      min-width: 100px;
    }

    .btn-calc {
      padding: 8px 20px;
      border: none;
      border-radius: 4px;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--button-bg);
      color: white;
      transition: background-color 0.2s ease;
      flex: 0 0 auto;
    }

    .btn-calc:hover {
      background-color: var(--button-hover);
    }

    .result-box {
      margin-top: 15px;
      padding: 12px 15px;
      background: var(--result-bg);
      border: 1px solid var(--result-border);
      border-radius: 4px;
      font-size: 0.95em;
      line-height: 1.8;
    }

    .result-item {
      margin: 5px 0;
    }

    .result-label {
      color: var(--text-secondary);
      display: inline-block;
      min-width: 120px;
    }

    .result-value {
      font-weight: 600;
      color: var(--text-color);
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background: var(--button-bg);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .back-link:hover {
      background: var(--button-hover);
    }

    @media (max-width: 768px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 2em;
      }

      .calc-row {
        flex-direction: column;
        align-items: stretch;
      }

      .calc-row input,
      .calc-row select,
      .btn-calc {
        width: 100%;
      }

      .result-label {
        min-width: auto;
        display: block;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>时间戳转换工具</h1>
    <p class="subtitle">Unix时间戳与日期时间相互转换</p>

    <!-- 当前时间 -->
    <div class="current-time">
      <div class="label">当前时间戳</div>
      <div>
        <span class="value" id="currentTimestamp">-</span>
        <button class="copy-btn" onclick="copyTimestamp()">复制</button>
      </div>
      <div class="label" style="margin-top: 10px;">当前时间</div>
      <div class="value" id="currentDateTime">-</div>
    </div>

    <!-- 时间戳转日期 -->
    <div class="calculator-card">
      <h2>时间戳 → 日期时间</h2>
      <div class="calc-row">
        <input type="number" id="timestampInput" placeholder="输入时间戳（秒或毫秒）" />
        <select id="timestampUnit">
          <option value="seconds">秒(s)</option>
          <option value="milliseconds">毫秒(ms)</option>
        </select>
        <button class="btn-calc" onclick="convertTimestampToDate()">转换</button>
      </div>
      <div id="timestampResult" class="result-box" style="display: none;">
        <div class="result-item">
          <span class="result-label">本地时间：</span>
          <span class="result-value" id="localTime">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">UTC时间：</span>
          <span class="result-value" id="utcTime">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">北京时间：</span>
          <span class="result-value" id="beijingTime">-</span>
        </div>
      </div>
    </div>

    <!-- 日期转时间戳 -->
    <div class="calculator-card">
      <h2>日期时间 → 时间戳</h2>
      <div class="calc-row">
        <input type="datetime-local" id="dateTimeInput" />
        <button class="btn-calc" onclick="convertDateToTimestamp()">转换</button>
      </div>
      <div id="dateResult" class="result-box" style="display: none;">
        <div class="result-item">
          <span class="result-label">时间戳（秒）：</span>
          <span class="result-value" id="timestampSeconds">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">时间戳（毫秒）：</span>
          <span class="result-value" id="timestampMilliseconds">-</span>
        </div>
      </div>
    </div>

    <div style="text-align: center;">
      <a href="./index.html" class="back-link">返回工具列表</a>
    </div>
  </div>

  <script>
    // 更新当前时间
    function updateCurrentTime() {
      const now = new Date();
      const timestamp = Math.floor(now.getTime() / 1000);
      
      document.getElementById('currentTimestamp').textContent = timestamp;
      document.getElementById('currentDateTime').textContent = 
        now.toLocaleString('zh-CN', { 
          year: 'numeric', 
          month: '2-digit', 
          day: '2-digit', 
          hour: '2-digit', 
          minute: '2-digit', 
          second: '2-digit',
          hour12: false 
        });
    }

    // 复制时间戳
    function copyTimestamp() {
      const timestamp = document.getElementById('currentTimestamp').textContent;
      const btn = event.target;
      const originalText = btn.textContent;
      
      // 尝试使用现代 Clipboard API
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(timestamp)
          .then(() => {
            btn.textContent = '已复制';
            setTimeout(() => {
              btn.textContent = originalText;
            }, 1500);
          })
          .catch(err => {
            console.error('Clipboard API 失败:', err);
            fallbackCopy(timestamp, btn, originalText);
          });
      } else {
        // 使用备用方案
        fallbackCopy(timestamp, btn, originalText);
      }
    }

    // 备用复制方案
    function fallbackCopy(text, btn, originalText) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      textArea.style.top = '-999999px';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          btn.textContent = '已复制';
          setTimeout(() => {
            btn.textContent = originalText;
          }, 1500);
        } else {
          alert('复制失败，请手动复制：' + text);
        }
      } catch (err) {
        console.error('备用复制方案失败:', err);
        alert('复制失败，请手动复制：' + text);
      }
      
      document.body.removeChild(textArea);
    }

    // 时间戳转日期
    function convertTimestampToDate() {
      const input = document.getElementById('timestampInput').value;
      const unit = document.getElementById('timestampUnit').value;
      
      if (!input) {
        alert('请输入时间戳');
        return;
      }

      let timestamp = parseInt(input);
      
      // 转换为毫秒
      if (unit === 'seconds') {
        timestamp = timestamp * 1000;
      }

      const date = new Date(timestamp);
      
      if (isNaN(date.getTime())) {
        alert('无效的时间戳');
        return;
      }

      const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      
      // 本地时间
      const localWeekday = weekdays[date.getDay()];
      const localTime = date.toLocaleString('zh-CN', { 
        year: 'numeric', 
        month: '2-digit', 
        day: '2-digit', 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: false 
      }) + ' ' + localWeekday;

      // UTC时间
      const utcDate = new Date(date.toISOString());
      const utcWeekday = weekdays[utcDate.getUTCDay()];
      const utcTime = date.toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, '') + ' ' + utcWeekday;

      // 北京时间 (UTC+8)
      const beijingDate = new Date(date.getTime());
      const beijingWeekday = weekdays[new Date(date.getTime() + (8 * 60 * 60 * 1000)).getUTCDay()];
      const beijingTime = new Date(date.getTime() + (8 * 60 * 60 * 1000)).toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, '') + ' ' + beijingWeekday;

      document.getElementById('localTime').textContent = localTime;
      document.getElementById('utcTime').textContent = utcTime;
      document.getElementById('beijingTime').textContent = beijingTime;
      
      document.getElementById('timestampResult').style.display = 'block';
    }

    // 日期转时间戳
    function convertDateToTimestamp() {
      const input = document.getElementById('dateTimeInput').value;
      
      if (!input) {
        alert('请选择日期时间');
        return;
      }

      const date = new Date(input);
      
      if (isNaN(date.getTime())) {
        alert('无效的日期时间');
        return;
      }

      const timestampMs = date.getTime();
      const timestampS = Math.floor(timestampMs / 1000);

      document.getElementById('timestampSeconds').textContent = timestampS;
      document.getElementById('timestampMilliseconds').textContent = timestampMs;
      
      document.getElementById('dateResult').style.display = 'block';
    }

    // 初始化
    function init() {
      updateCurrentTime();
      setInterval(updateCurrentTime, 1000);
      
      // 设置当前时间为默认值
      const now = new Date();
      const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
        .toISOString()
        .slice(0, 16);
      document.getElementById('dateTimeInput').value = localDateTime;
    }

    // 页面加载时初始化
    window.onload = init;
  </script>
</body>

</html>
