<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本对比工具</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --text-secondary: #666666;
      --card-bg: #f9f9f9;
      --card-border: #dddddd;
      --button-bg: #28a745;
      --button-hover: #218838;
      --button-secondary: #6c757d;
      --button-secondary-hover: #5a6268;
      --shadow: rgba(0, 0, 0, 0.1);
      --textarea-bg: #ffffff;
      --diff-add-bg: #d4edda;
      --diff-add-border: #c3e6cb;
      --diff-remove-bg: #f8d7da;
      --diff-remove-border: #f5c6cb;
      --diff-equal-bg: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --text-color: #ffffff;
        --text-secondary: #cccccc;
        --card-bg: #2d2d2d;
        --card-border: #555555;
        --button-bg: #28a745;
        --button-hover: #34ce57;
        --button-secondary: #6c757d;
        --button-secondary-hover: #868e96;
        --shadow: rgba(0, 0, 0, 0.3);
        --textarea-bg: #3a3a3a;
        --diff-add-bg: #1e4620;
        --diff-add-border: #2d5f2e;
        --diff-remove-bg: #5a1f1f;
        --diff-remove-border: #7a2e2e;
        --diff-equal-bg: #2d2d2d;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      color: var(--text-color);
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 30px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      color: white;
    }

    .btn-primary {
      background-color: var(--button-bg);
    }

    .btn-primary:hover {
      background-color: var(--button-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--button-secondary);
    }

    .btn-secondary:hover {
      background-color: var(--button-secondary-hover);
      transform: translateY(-1px);
    }

    .input-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .input-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 4px var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .input-box h2 {
      margin: 0 0 15px 0;
      font-size: 1.3em;
      color: var(--text-color);
    }

    .input-box textarea {
      width: 100%;
      height: 300px;
      padding: 15px;
      font-size: 14px;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      border: 2px solid var(--card-border);
      border-radius: 5px;
      background-color: var(--textarea-bg);
      color: var(--text-color);
      resize: vertical;
      transition: border-color 0.2s ease, background-color 0.3s ease;
    }

    .input-box textarea:focus {
      outline: none;
      border-color: var(--button-bg);
    }

    .result-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 4px var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .result-section h2 {
      margin: 0 0 15px 0;
      font-size: 1.3em;
      color: var(--text-color);
    }

    .diff-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .diff-panel {
      border: 1px solid var(--card-border);
      border-radius: 5px;
      overflow: auto;
      max-height: 600px;
      background-color: var(--textarea-bg);
    }

    .diff-panel h3 {
      margin: 0;
      padding: 10px 15px;
      background-color: var(--card-border);
      color: var(--text-color);
      font-size: 1em;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .diff-content {
      padding: 10px;
    }

    .diff-line {
      padding: 8px 12px;
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.8;
    }

    .diff-line span.diff-add {
      background-color: var(--diff-add-bg);
      padding: 2px 0;
      border-radius: 2px;
    }

    .diff-line span.diff-remove {
      background-color: var(--diff-remove-bg);
      padding: 2px 0;
      border-radius: 2px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
      padding: 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      flex-wrap: wrap;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: var(--button-bg);
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9em;
      margin-top: 5px;
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background: var(--button-bg);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .back-link:hover {
      background: var(--button-hover);
    }

    @media (max-width: 1024px) {
      .input-section,
      .diff-container {
        grid-template-columns: 1fr;
      }

      .diff-panel {
        max-height: 400px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 2em;
      }

      .input-box textarea {
        height: 200px;
      }

      .controls {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>文本对比工具</h1>
    <p class="subtitle">比较两段文本的差异，支持逐行对比和高亮显示</p>

    <div class="controls">
      <button class="btn btn-primary" onclick="compareTexts()">开始对比</button>
      <button class="btn btn-secondary" onclick="clearAll()">清空所有</button>
      <button class="btn btn-secondary" onclick="swapTexts()">交换文本</button>
    </div>

    <div class="input-section">
      <div class="input-box">
        <h2>原始文本</h2>
        <textarea id="text1" placeholder="在此输入或粘贴原始文本..."></textarea>
      </div>
      <div class="input-box">
        <h2>对比文本</h2>
        <textarea id="text2" placeholder="在此输入或粘贴要对比的文本..."></textarea>
      </div>
    </div>

    <div class="result-section" id="resultSection" style="display: none;">
      <h2>对比结果</h2>
      <div class="diff-container">
        <div class="diff-panel">
          <h3>原始文本</h3>
          <div class="diff-content" id="diff1"></div>
        </div>
        <div class="diff-panel">
          <h3>对比文本</h3>
          <div class="diff-content" id="diff2"></div>
        </div>
      </div>
      <div class="stats">
        <div class="stat-item">
          <div class="stat-value" id="text1Length">0</div>
          <div class="stat-label">原始文本长度</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="text2Length">0</div>
          <div class="stat-label">对比文本长度</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="addedLines">0</div>
          <div class="stat-label">新增字符</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="removedLines">0</div>
          <div class="stat-label">删除字符</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="unchangedLines">0</div>
          <div class="stat-label">相同字符</div>
        </div>
      </div>
    </div>

    <div style="text-align: center;">
      <a href="./index.html" class="back-link">返回工具列表</a>
    </div>
  </div>

  <script>
    // 字符级别的差异算法
    function computeCharDiff(text1, text2) {
      const len1 = text1.length;
      const len2 = text2.length;
      
      // 动态规划计算LCS
      const dp = Array(len1 + 1).fill(null).map(() => Array(len2 + 1).fill(0));
      
      for (let i = 1; i <= len1; i++) {
        for (let j = 1; j <= len2; j++) {
          if (text1[i - 1] === text2[j - 1]) {
            dp[i][j] = dp[i - 1][j - 1] + 1;
          } else {
            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
          }
        }
      }
      
      // 回溯构建差异
      const diff = [];
      let i = len1, j = len2;
      
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && text1[i - 1] === text2[j - 1]) {
          diff.unshift({ type: 'equal', char1: text1[i - 1], char2: text2[j - 1] });
          i--;
          j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          diff.unshift({ type: 'add', char2: text2[j - 1] });
          j--;
        } else if (i > 0) {
          diff.unshift({ type: 'remove', char1: text1[i - 1] });
          i--;
        }
      }
      
      return diff;
    }

    function highlightDiff(diff, isLeft) {
      const container = document.createElement('div');
      container.className = 'diff-line';
      
      diff.forEach(item => {
        const span = document.createElement('span');
        
        if (item.type === 'equal') {
          span.textContent = isLeft ? item.char1 : item.char2;
          span.style.color = 'var(--text-secondary)';
        } else if (item.type === 'remove') {
          if (isLeft) {
            span.textContent = item.char1;
            span.className = 'diff-remove';
          }
        } else if (item.type === 'add') {
          if (!isLeft) {
            span.textContent = item.char2;
            span.className = 'diff-add';
          }
        }
        
        if (span.textContent) {
          container.appendChild(span);
        }
      });
      
      return container;
    }

    function compareTexts() {
      const text1 = document.getElementById('text1').value;
      const text2 = document.getElementById('text2').value;
      
      if (!text1 && !text2) {
        alert('请至少输入一段文本');
        return;
      }
      
      const diff = computeCharDiff(text1, text2);
      
      const diff1Container = document.getElementById('diff1');
      const diff2Container = document.getElementById('diff2');
      
      diff1Container.innerHTML = '';
      diff2Container.innerHTML = '';
      
      // 统计差异
      let addedCount = 0;
      let removedCount = 0;
      let unchangedCount = 0;
      
      diff.forEach(item => {
        if (item.type === 'equal') unchangedCount++;
        else if (item.type === 'add') addedCount++;
        else if (item.type === 'remove') removedCount++;
      });
      
      // 渲染左侧（原始文本）
      const leftContent = highlightDiff(diff, true);
      diff1Container.appendChild(leftContent);
      
      // 渲染右侧（对比文本）
      const rightContent = highlightDiff(diff, false);
      diff2Container.appendChild(rightContent);
      
      document.getElementById('text1Length').textContent = text1.length;
      document.getElementById('text2Length').textContent = text2.length;
      document.getElementById('addedLines').textContent = addedCount;
      document.getElementById('removedLines').textContent = removedCount;
      document.getElementById('unchangedLines').textContent = unchangedCount;
      
      document.getElementById('resultSection').style.display = 'block';
      document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function clearAll() {
      document.getElementById('text1').value = '';
      document.getElementById('text2').value = '';
      document.getElementById('resultSection').style.display = 'none';
    }

    function swapTexts() {
      const text1 = document.getElementById('text1');
      const text2 = document.getElementById('text2');
      const temp = text1.value;
      text1.value = text2.value;
      text2.value = temp;
    }

    // 支持快捷键
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        compareTexts();
      }
    });
  </script>
</body>

</html>
