<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON转iOS模型</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --text-secondary: #666666;
      --card-bg: #f9f9f9;
      --card-border: #dddddd;
      --button-bg: #28a745;
      --button-hover: #218838;
      --button-secondary: #6c757d;
      --button-secondary-hover: #5a6268;
      --shadow: rgba(0, 0, 0, 0.1);
      --input-bg: #ffffff;
      --input-border: #dddddd;
      --accent-color: #007bff;
      --swift-color: #FA7343;
      --oc-color: #438EFF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --text-color: #ffffff;
        --text-secondary: #cccccc;
        --card-bg: #2d2d2d;
        --card-border: #555555;
        --button-bg: #28a745;
        --button-hover: #34ce57;
        --button-secondary: #6c757d;
        --button-secondary-hover: #868e96;
        --shadow: rgba(0, 0, 0, 0.3);
        --input-bg: #3a3a3a;
        --input-border: #555555;
        --accent-color: #4dabf7;
        --swift-color: #FA8966;
        --oc-color: #6BA3FF;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      color: var(--text-color);
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 30px;
      font-size: 0.95em;
    }

    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .editor-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 4px var(--shadow);
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .editor-title {
      font-size: 1.1em;
      font-weight: 600;
      color: var(--text-color);
    }

    .editor-panel textarea {
      width: 100%;
      height: 400px;
      padding: 12px;
      font-size: 0.9em;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
      resize: vertical;
      line-height: 1.5;
    }

    .editor-panel textarea:focus {
      outline: none;
      border-color: var(--button-bg);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
    }

    .btn-primary {
      background: var(--button-bg);
    }

    .btn-primary:hover {
      background: var(--button-hover);
    }

    .btn-secondary {
      background: var(--button-secondary);
    }

    .btn-secondary:hover {
      background: var(--button-secondary-hover);
    }

    .btn-swift {
      background: var(--swift-color);
    }

    .btn-swift:hover {
      background: #E8623F;
    }

    .btn-oc {
      background: var(--oc-color);
    }

    .btn-oc:hover {
      background: #5B8FEE;
    }

    .settings-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 4px var(--shadow);
    }

    .settings-title {
      font-size: 1.2em;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--text-color);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
    }

    .setting-item label {
      font-size: 0.9em;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .setting-item input,
    .setting-item select {
      padding: 10px;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 0.95em;
    }

    .setting-item input:focus,
    .setting-item select:focus {
      outline: none;
      border-color: var(--button-bg);
    }

    .checkbox-item {
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }

    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .checkbox-item label {
      margin-bottom: 0;
      cursor: pointer;
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 0.9em;
      display: none;
    }

    .status.error {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid #dc3545;
      color: #dc3545;
      display: block;
    }

    .status.success {
      background: rgba(40, 167, 69, 0.1);
      border: 1px solid #28a745;
      color: #28a745;
      display: block;
    }

    .copy-btn-small {
      padding: 4px 12px;
      background: var(--button-bg);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 0.85em;
      cursor: pointer;
    }

    .copy-btn-small:hover {
      background: var(--button-hover);
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: var(--button-bg);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .back-link:hover {
      background: var(--button-hover);
    }

    .generated-code {
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 4px;
      padding: 15px;
      font-size: 0.9em;
      line-height: 1.6;
      overflow-x: auto;
    }

    @media (max-width: 1024px) {
      .editor-container {
        grid-template-columns: 1fr;
      }

      .editor-panel textarea {
        height: 250px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 2em;
      }

      .controls {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📱 JSON转iOS模型</h1>
    <p class="subtitle">将JSON数据转换为Objective-C或Swift模型代码</p>

    <!-- 设置面板 -->
    <div class="settings-card">
      <div class="settings-title">⚙️ 生成设置</div>
      <div class="settings-grid">
        <div class="setting-item">
          <label>类名前缀</label>
          <input type="text" id="classPrefix" placeholder="如: WS (可选)">
        </div>
        <div class="setting-item">
          <label>根类名</label>
          <input type="text" id="rootClassName" placeholder="如: User" value="RootModel">
        </div>
        <div class="setting-item checkbox-item">
          <input type="checkbox" id="useOptional" checked>
          <label for="useOptional">可选类型 (Swift)</label>
        </div>
        <div class="setting-item checkbox-item">
          <input type="checkbox" id="useProperty">
          <label for="useProperty">属性 (Property) 命名</label>
        </div>
      </div>
    </div>

    <!-- 输入输出编辑器 -->
    <div class="editor-container">
      <div class="editor-panel">
        <div class="editor-header">
          <span class="editor-title">📝 JSON 输入</span>
          <button class="copy-btn-small" onclick="formatJSON()">格式化</button>
        </div>
        <textarea id="inputJSON" placeholder='输入JSON数据，例如：
{
  "id": 1,
  "name": "张三",
  "age": 25,
  "email": "zhangsan@example.com",
  "isVip": true,
  "balance": 99.99,
  "friends": [
    {"name": "李四", "age": 24}
  ]
}'></textarea>
        <div class="status" id="inputStatus"></div>
      </div>

      <div class="editor-panel">
        <div class="editor-header">
          <span class="editor-title" id="outputTitle">📄 生成的代码</span>
          <button class="copy-btn-small" onclick="copyOutput()">复制</button>
        </div>
        <div class="generated-code" id="outputCode">生成的代码将显示在这里...</div>
        <div class="status" id="outputStatus"></div>
      </div>
    </div>

    <!-- 生成按钮 -->
    <div class="controls">
      <button class="btn btn-swift" onclick="generateSwift()">🍎 生成 Swift</button>
      <button class="btn btn-oc" onclick="generateOC()">🔶 生成 Objective-C</button>
      <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空</button>
      <button class="btn btn-primary" onclick="downloadFiles()" id="downloadBtn" style="display: none;">📥 下载文件</button>
    </div>

    <div style="text-align: center;">
      <a href="./index.html" class="back-link">返回工具列表</a>
    </div>
  </div>

  <script>
    // 存储生成的文件
    let generatedFiles = {
      type: '', // 'swift' or 'oc'
      files: [] // { name: string, content: string }
    };

    // 类型推断
    function inferType(value) {
      if (value === null || value === undefined) {
        return { type: 'id', isOptional: true, isPrimitive: false };
      }

      const type = typeof value;

      if (type === 'number') {
        // 判断是Int还是Double
        if (Number.isInteger(value)) {
          if (value >= -2147483648 && value <= 2147483647) {
            return { type: 'NSInteger', isOptional: false, isPrimitive: true };
          } else {
            return { type: 'long long', isOptional: false, isPrimitive: true };
          }
        } else {
          return { type: 'CGFloat', isOptional: false, isPrimitive: true };
        }
      }

      if (type === 'boolean') {
        return { type: 'BOOL', isOptional: false, isPrimitive: true };
      }

      if (type === 'string') {
        return { type: 'NSString', isOptional: false, isPrimitive: false };
      }

      if (Array.isArray(value)) {
        return { type: 'NSArray', isOptional: false, isPrimitive: false, isArray: true, items: value };
      }

      if (type === 'object') {
        return { type: 'NSDictionary', isOptional: false, isPrimitive: false, value: value };
      }

      return { type: 'id', isOptional: true, isPrimitive: false };
    }

    // 生成Swift代码
    function generateSwift() {
      const input = document.getElementById('inputJSON').value.trim();

      if (!input) {
        showStatus('inputStatus', '请输入JSON数据', 'error');
        return;
      }

      let json;
      try {
        json = JSON.parse(input);
      } catch (e) {
        showStatus('inputStatus', 'JSON格式错误: ' + e.message, 'error');
        return;
      }

      const prefix = document.getElementById('classPrefix').value.trim();
      const rootName = document.getElementById('rootClassName').value.trim() || 'RootModel';
      const useOptional = document.getElementById('useOptional').checked;

      const generatedClasses = new Map();
      generatedFiles.files = [];
      generateSwiftClasses(json, rootName, generatedClasses, prefix, useOptional);

      let output = '';
      generatedClasses.forEach((classInfo, className) => {
        output += classInfo;
      });

      // 存储文件
      generatedFiles.type = 'swift';
      generatedClasses.forEach((classInfo, className) => {
        generatedFiles.files.push({
          name: className + '.swift',
          content: classInfo
        });
      });

      document.getElementById('outputTitle').textContent = '📄 Swift 代码';
      document.getElementById('outputCode').textContent = output || '未生成任何代码';
      document.getElementById('downloadBtn').style.display = 'inline-block';
      showStatus('outputStatus', 'Swift代码生成成功，点击"下载文件"可下载', 'success');
      hideStatus('inputStatus');
    }

    // 生成Swift类
    function generateSwiftClasses(obj, className, generatedClasses, prefix, useOptional) {
      const fullClassName = prefix + className;

      if (generatedClasses.has(fullClassName)) {
        return fullClassName;
      }

      let properties = [];
      let propertyTypes = {};

      for (const [key, value] of Object.entries(obj)) {
        const typeInfo = inferType(value);
        const swiftType = getSwiftType(typeInfo, key, generatedClasses, prefix, useOptional, obj);

        // 属性名处理：如果是OC命名转换为驼峰
        const propertyName = key.replace(/_([a-z])/g, (match, letter) => letter.toUpperCase());
        properties.push({ key, propertyName, typeInfo, swiftType });
        propertyTypes[key] = swiftType;
      }

      // 生成类代码
      let classCode = `struct ${fullClassName}: Codable {\n`;

      properties.forEach(p => {
        const optionalMark = useOptional && (p.typeInfo.isOptional || p.typeInfo.type === 'NSArray' || p.typeInfo.type === 'NSDictionary') ? '?' : '';
        classCode += `    let ${p.propertyName}: ${p.swiftType}${optionalMark}\n`;
      });

      classCode += `}\n\n`;

      generatedClasses.set(fullClassName, classCode);

      // 递归处理数组中的对象
      properties.forEach(p => {
        if (p.typeInfo.isArray && p.typeInfo.items && p.typeInfo.items.length > 0) {
          const firstItem = p.typeInfo.items[0];
          if (typeof firstItem === 'object' && firstItem !== null) {
            const arrayClassName = toPascalCase(p.key);
            generateSwiftClasses(firstItem, arrayClassName, generatedClasses, prefix, useOptional);
          }
        }
      });

      // 递归处理嵌套对象（字典）
      properties.forEach(p => {
        if (p.typeInfo.type === 'NSDictionary' && p.typeInfo.value && typeof p.typeInfo.value === 'object') {
          const nestedClassName = toPascalCase(p.key);
          generateSwiftClasses(p.typeInfo.value, nestedClassName, generatedClasses, prefix, useOptional);
        }
      });

      return fullClassName;
    }

    // 获取Swift类型
    function getSwiftType(typeInfo, key, generatedClasses, prefix, useOptional, parentObj) {
      switch (typeInfo.type) {
        case 'NSInteger':
          return 'Int';
        case 'long long':
          return 'Int64';
        case 'CGFloat':
          return 'Double';
        case 'BOOL':
          return 'Bool';
        case 'NSString':
          return 'String';
        case 'NSArray':
          if (typeInfo.items && typeInfo.items.length > 0) {
            const firstItem = typeInfo.items[0];
            if (typeof firstItem === 'object' && firstItem !== null) {
              const arrayClassName = prefix + toPascalCase(key);
              return `[${arrayClassName}]`;
            }
          }
          return '[Any]';
        case 'NSDictionary':
          // 检查是否是嵌套对象，需要生成子类
          if (parentObj && parentObj[key] && typeof parentObj[key] === 'object' && !Array.isArray(parentObj[key])) {
            const nestedClassName = prefix + toPascalCase(key);
            return nestedClassName;
          }
          return '[String: Any]';
        default:
          return 'Any';
      }
    }

    // 生成Objective-C代码
    function generateOC() {
      const input = document.getElementById('inputJSON').value.trim();

      if (!input) {
        showStatus('inputStatus', '请输入JSON数据', 'error');
        return;
      }

      let json;
      try {
        json = JSON.parse(input);
      } catch (e) {
        showStatus('inputStatus', 'JSON格式错误: ' + e.message, 'error');
        return;
      }

      const prefix = document.getElementById('classPrefix').value.trim();
      const rootName = document.getElementById('rootClassName').value.trim() || 'RootModel';

      const generatedClasses = new Map();
      const allClasses = [];
      generatedFiles.files = [];

      // 先生成所有类
      generateOCClasses(json, rootName, generatedClasses, prefix, allClasses);

      // 获取有序的类名列表
      const orderedClassNames = [prefix + rootName];
      generatedClasses.forEach((_, className) => {
        if (className !== prefix + rootName) {
          orderedClassNames.push(className);
        }
      });

      // 分别拼接.h和.m文件
      let headerOutput = '';
      let implOutput = '';
      const fileContents = new Map();

      orderedClassNames.forEach(className => {
        const code = generatedClasses.get(className);
        if (code) {
          const { header, impl } = splitHeaderImpl(code);
          headerOutput += header + '\n';
          implOutput += impl + '\n';
          fileContents.set(className, { header, impl });
        }
      });

      // 存储文件
      generatedFiles.type = 'oc';
      fileContents.forEach((content, className) => {
        generatedFiles.files.push({
          name: className + '.h',
          content: content.header
        });
        generatedFiles.files.push({
          name: className + '.m',
          content: content.impl
        });
      });

      const output = headerOutput + '\n\n' + implOutput;
      document.getElementById('outputTitle').textContent = '📄 Objective-C 代码';
      document.getElementById('outputCode').textContent = output || '未生成任何代码';
      document.getElementById('downloadBtn').style.display = 'inline-block';
      showStatus('outputStatus', 'Objective-C代码生成成功，点击"下载文件"可下载', 'success');
      hideStatus('inputStatus');
    }

    // 分离.h和.m代码
    function splitHeaderImpl(code) {
      // 找到 @end 的位置来分离
      const parts = code.split('@end');
      const headerEnd = parts[0] + '@end';
      const implStart = parts.slice(1).join('@end').trim();

      return {
        header: headerEnd,
        impl: implStart
      };
    }

    // 生成OC类
    function generateOCClasses(obj, className, generatedClasses, prefix, allClasses) {
      const fullClassName = prefix + className;

      if (generatedClasses.has(fullClassName)) {
        return;
      }

      let properties = [];
      const imports = [];

      for (const [key, value] of Object.entries(obj)) {
        const typeInfo = inferType(value);
        const property = generateOCProperty(key, typeInfo, generatedClasses, prefix, obj);
        properties.push({ key, ...property });

        // 收集需要导入的类
        if (property.isCustomClass && !imports.includes(property.importName)) {
          imports.push(property.importName);
        }
      }

      // 生成.h文件
      let headerCode = `#import <UIKit/UIKit.h>\n`;
      imports.forEach(imp => {
        headerCode += `#import "${imp}.h"\n`;
      });
      headerCode += `\n@interface ${fullClassName} : NSObject\n\n`;

      properties.forEach(p => {
        let propertyDeclaration;
        if (p.isPrimitive) {
          // 基本类型：assign，无*
          propertyDeclaration = `@property (nonatomic, assign) ${p.ocType} ${p.propertyName};\n`;
        } else if (p.isCustomClass || p.isNestedObject) {
          // 自定义类或嵌套对象：strong，有*
          propertyDeclaration = `@property (nonatomic, strong) ${p.ocType} *${p.propertyName};\n`;
        } else {
          // NSString等：copy，有*
          propertyDeclaration = `@property (nonatomic, copy) ${p.ocType} *${p.propertyName};\n`;
        }
        headerCode += propertyDeclaration;
      });

      headerCode += `\n-(instancetype)initWithDictionary:(NSDictionary *)dictionary;\n`;
      headerCode += `-(NSDictionary *)toDictionary;\n`;
      headerCode += `@end\n\n`;

      // 生成.m文件
      let implCode = `#import "${fullClassName}.h"\n\n`;

      // 生成常量定义
      properties.forEach(p => {
        implCode += `NSString *const k${fullClassName}${toPascalCase(p.key)} = @"${p.key}";\n`;
      });

      implCode += `\n@interface ${fullClassName} ()\n@end\n`;
      implCode += `@implementation ${fullClassName}\n\n`;

      // 生成initWithDictionary方法
      implCode += `-(instancetype)initWithDictionary:(NSDictionary *)dictionary\n{\n`;
      implCode += `\tself = [super init];\n`;
      implCode += `\tif(dictionary){\n`;

      properties.forEach(p => {
        if (p.isArray) {
          if (p.isCustomClass) {
            // 数组中是对象
            implCode += `\t\tif(dictionary[k${fullClassName}${toPascalCase(p.key)}] != nil && [dictionary[k${fullClassName}${toPascalCase(p.key)}] isKindOfClass:[NSArray class]]){\n`;
            implCode += `\t\t\tNSArray * ${p.key}Dictionaries = dictionary[k${fullClassName}${toPascalCase(p.key)}];\n`;
            implCode += `\t\t\tNSMutableArray * ${p.key}Items = [NSMutableArray array];\n`;
            implCode += `\t\t\tfor(NSDictionary * ${p.key}Dictionary in ${p.key}Dictionaries){\n`;
            implCode += `\t\t\t\t${p.itemClassName} * ${p.key}Item = [[${p.itemClassName} alloc] initWithDictionary:${p.key}Dictionary];\n`;
            implCode += `\t\t\t\t[${p.key}Items addObject:${p.key}Item];\n`;
            implCode += `\t\t\t}\n`;
            implCode += `\t\t\tself.${p.propertyName} = ${p.key}Items;\n`;
            implCode += `\t\t}\n`;
          } else {
            // 数组中是基本类型
            implCode += `\t\tif(dictionary[k${fullClassName}${toPascalCase(p.key)}] != nil && [dictionary[k${fullClassName}${toPascalCase(p.key)}] isKindOfClass:[NSArray class]]){\n`;
            implCode += `\t\t\tself.${p.propertyName} = dictionary[k${fullClassName}${toPascalCase(p.key)}];\n`;
            implCode += `\t\t}\n`;
          }
        } else if (p.isNestedObject) {
          // 嵌套对象
          implCode += `\t\tif(![dictionary[k${fullClassName}${toPascalCase(p.key)}] isKindOfClass:[NSNull class]]){\n`;
          implCode += `\t\t\tself.${p.propertyName} = [[${p.ocType} alloc] initWithDictionary:dictionary[k${fullClassName}${toPascalCase(p.key)}]];\n`;
          implCode += `\t\t}\n`;
        } else if (p.isPrimitive) {
          // 基本类型
          if (p.ocType === 'BOOL') {
            implCode += `\t\tif(![dictionary[k${fullClassName}${toPascalCase(p.key)}] isKindOfClass:[NSNull class]]){\n`;
            implCode += `\t\t\tself.${p.propertyName} = [dictionary[k${fullClassName}${toPascalCase(p.key)}] boolValue];\n`;
            implCode += `\t\t}\n`;
          } else if (p.ocType === 'NSInteger') {
            implCode += `\t\tif(![dictionary[k${fullClassName}${toPascalCase(p.key)}] isKindOfClass:[NSNull class]]){\n`;
            implCode += `\t\t\tself.${p.propertyName} = [dictionary[k${fullClassName}${toPascalCase(p.key)}] integerValue];\n`;
            implCode += `\t\t}\n`;
          } else {
            implCode += `\t\tif(![dictionary[k${fullClassName}${toPascalCase(p.key)}] isKindOfClass:[NSNull class]]){\n`;
            implCode += `\t\t\tself.${p.propertyName} = [dictionary[k${fullClassName}${toPascalCase(p.key)}] doubleValue];\n`;
            implCode += `\t\t}\n`;
          }
        } else if (p.isCustomClass) {
          // 自定义对象
          implCode += `\t\tif(![dictionary[k${fullClassName}${toPascalCase(p.key)}] isKindOfClass:[NSNull class]]){\n`;
          implCode += `\t\t\tself.${p.propertyName} = [[${p.ocType} alloc] initWithDictionary:dictionary[k${fullClassName}${toPascalCase(p.key)}]];\n`;
          implCode += `\t\t}\n`;
        } else {
          // NSString等
          implCode += `\t\tif(![dictionary[k${fullClassName}${toPascalCase(p.key)}] isKindOfClass:[NSNull class]]){\n`;
          implCode += `\t\t\tself.${p.propertyName} = dictionary[k${fullClassName}${toPascalCase(p.key)}];\n`;
          implCode += `\t\t}\n`;
        }
      });

      implCode += `\t}\n`;
      implCode += `\treturn self;\n`;
      implCode += `}\n\n`;

      // 生成toDictionary方法
      implCode += `-(NSDictionary *)toDictionary\n{\n`;
      implCode += `\tNSMutableDictionary * dictionary = [NSMutableDictionary dictionary];\n`;

      properties.forEach(p => {
        if (p.isArray) {
          implCode += `\tif(self.${p.propertyName} != nil){\n`;
          implCode += `\t\tNSMutableArray * dictionaryElements = [NSMutableArray array];\n`;
          implCode += `\t\tfor(${p.itemClassName ? p.itemClassName + ' * ' : ''}${p.propertyName}Element in self.${p.propertyName}){\n`;
          if (p.itemClassName) {
            implCode += `\t\t\t[dictionaryElements addObject:[${p.propertyName}Element toDictionary]];\n`;
          } else {
            implCode += `\t\t\t[dictionaryElements addObject:${p.propertyName}Element];\n`;
          }
          implCode += `\t\t}\n`;
          implCode += `\t\tdictionary[k${fullClassName}${toPascalCase(p.key)}] = dictionaryElements;\n`;
          implCode += `\t}\n`;
        } else if (p.isPrimitive) {
          implCode += `\tif(self.${p.propertyName} != 0){\n`;
          implCode += `\t\tdictionary[k${fullClassName}${toPascalCase(p.key)}] = @(self.${p.propertyName});\n`;
          implCode += `\t}\n`;
        } else if (p.isNestedObject || p.isCustomClass) {
          implCode += `\tif(self.${p.propertyName} != nil){\n`;
          implCode += `\t\tdictionary[k${fullClassName}${toPascalCase(p.key)}] = [self.${p.propertyName} toDictionary];\n`;
          implCode += `\t}\n`;
        } else {
          implCode += `\tif(self.${p.propertyName} != nil){\n`;
          implCode += `\t\tdictionary[k${fullClassName}${toPascalCase(p.key)}] = self.${p.propertyName};\n`;
          implCode += `\t}\n`;
        }
      });

      implCode += `\treturn dictionary;\n`;
      implCode += `}\n\n`;
      implCode += `@end\n\n`;

      generatedClasses.set(fullClassName, headerCode + implCode);

      // 递归处理数组中的对象
      properties.forEach(p => {
        if (p.isArray && p.items && p.items.length > 0) {
          const firstItem = p.items[0];
          if (typeof firstItem === 'object' && firstItem !== null) {
            const arrayClassName = toPascalCase(p.key);
            generateOCClasses(firstItem, arrayClassName, generatedClasses, prefix, allClasses);
          }
        }
      });

      // 递归处理嵌套对象（字典）
      properties.forEach(p => {
        if (p.isNestedObject && p.nestedValue && typeof p.nestedValue === 'object') {
          const nestedClassName = toPascalCase(p.key);
          generateOCClasses(p.nestedValue, nestedClassName, generatedClasses, prefix, allClasses);
        }
      });
    }

    // 生成OC属性
    function generateOCProperty(key, typeInfo, generatedClasses, prefix, parentObj) {
      // 属性名首字母小写
      const propertyName = key.replace(/^./, (match) => match.toLowerCase());

      switch (typeInfo.type) {
        case 'NSInteger':
          return { ocType: 'NSInteger', isPrimitive: true, propertyName, type: 'NSInteger' };
        case 'long long':
          return { ocType: 'long long', isPrimitive: true, propertyName, type: 'long long' };
        case 'CGFloat':
          return { ocType: 'CGFloat', isPrimitive: true, propertyName, type: 'CGFloat' };
        case 'BOOL':
          return { ocType: 'BOOL', isPrimitive: true, propertyName, type: 'BOOL' };
        case 'NSString':
          return { ocType: 'NSString', isPrimitive: false, propertyName, type: 'NSString' };
        case 'NSArray':
          let arrayType = 'NSArray';
          let isCustomClass = false;
          let itemClassName = null;
          if (typeInfo.items && typeInfo.items.length > 0) {
            const firstItem = typeInfo.items[0];
            if (typeof firstItem === 'object' && firstItem !== null) {
              itemClassName = prefix + toPascalCase(key);
              arrayType = `NSArray<${itemClassName} *>`;
              isCustomClass = true;
            }
          }
          return {
            ocType: arrayType,
            isPrimitive: false,
            isArray: true,
            items: typeInfo.items,
            propertyName,
            type: 'NSArray',
            isCustomClass,
            itemClassName,
            importName: itemClassName
          };
        case 'NSDictionary':
          // 检查是否是嵌套对象，需要生成子类
          if (parentObj && parentObj[key] && typeof parentObj[key] === 'object' && !Array.isArray(parentObj[key])) {
            const nestedClassName = prefix + toPascalCase(key);
            return {
              ocType: nestedClassName,
              isPrimitive: false,
              propertyName,
              type: 'NSDictionary',
              isNestedObject: true,
              nestedValue: parentObj[key],
              isCustomClass: true,
              importName: nestedClassName
            };
          }
          return { ocType: 'NSDictionary', isPrimitive: false, propertyName, type: 'NSDictionary' };
        default:
          return { ocType: 'id', isPrimitive: false, propertyName, type: 'id' };
      }
    }

    // 工具函数：将下划线转换为PascalCase
    function toPascalCase(str) {
      return str
        .replace(/_([a-z])/g, (match, letter) => letter.toUpperCase())
        .replace(/^./, (match) => match.toUpperCase())
        .replace(/([A-Z])/g, (match) => match);
    }

    // 格式化JSON
    function formatJSON() {
      const input = document.getElementById('inputJSON').value.trim();
      
      if (!input) {
        showStatus('inputStatus', '请输入JSON数据', 'error');
        return;
      }

      try {
        const parsed = JSON.parse(input);
        const formatted = JSON.stringify(parsed, null, 2);
        document.getElementById('inputJSON').value = formatted;
        showStatus('inputStatus', 'JSON格式化成功', 'success');
      } catch (e) {
        showStatus('inputStatus', 'JSON格式错误: ' + e.message, 'error');
      }
    }

    // 复制输出
    function copyOutput() {
      const output = document.getElementById('outputCode').textContent;
      if (output === '生成的代码将显示在这里...') {
        showStatus('outputStatus', '没有可复制的内容', 'error');
        return;
      }
      copyToClipboard(output);
      showStatus('outputStatus', '代码已复制到剪贴板', 'success');
    }

    // 清空
    function clearAll() {
      document.getElementById('inputJSON').value = '';
      document.getElementById('outputCode').textContent = '生成的代码将显示在这里...';
      document.getElementById('inputStatus').style.display = 'none';
      document.getElementById('outputStatus').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';
      generatedFiles = { type: '', files: [] };
    }

    // 显示状态
    function showStatus(id, message, type) {
      const status = document.getElementById(id);
      status.textContent = message;
      status.className = 'status ' + type;
      status.style.display = 'block';
    }

    // 隐藏状态
    function hideStatus(id) {
      const status = document.getElementById(id);
      status.style.display = 'none';
    }

    // 复制到剪贴板
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    // 备用复制方案
    function fallbackCopy(text) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      document.body.appendChild(textArea);
      textArea.select();

      try {
        document.execCommand('copy');
      } catch (err) {
        console.error('复制失败:', err);
      }

      document.body.removeChild(textArea);
    }

    // 下载文件
    function downloadFiles() {
      if (generatedFiles.files.length === 0) {
        showStatus('outputStatus', '没有可下载的文件', 'error');
        return;
      }

      const zip = new JSZip();
      const rootName = document.getElementById('rootClassName').value.trim() || 'RootModel';

      if (generatedFiles.type === 'oc') {
        // OC文件按类分组，每个类有.h和.m
        let currentClass = null;
        generatedFiles.files.forEach(file => {
          const className = file.name.replace(/\.(h|m)$/, '');
          if (!currentClass || currentClass.name !== className) {
            currentClass = { name: className, files: [] };
          }
          currentClass.files.push(file);
        });

        // 重新组织：按类名创建文件夹
        generatedFiles.files.forEach(file => {
          const className = file.name.replace(/\.(h|m)$/, '');
          zip.file(file.name, file.content);
        });

        zip.generateAsync({ type: 'blob' }).then(blob => {
          downloadBlob(blob, rootName + '.zip');
          showStatus('outputStatus', '已开始下载压缩包', 'success');
        });
      } else {
        // Swift文件合并为一个
        if (generatedFiles.files.length === 1) {
          zip.file(generatedFiles.files[0].name, generatedFiles.files[0].content);
        } else {
          let combined = '';
          generatedFiles.files.forEach(file => {
            combined += '// ===== ' + file.name + ' =====\n\n' + file.content + '\n\n';
          });
          zip.file(rootName + 'Models.swift', combined);
        }

        zip.generateAsync({ type: 'blob' }).then(blob => {
          downloadBlob(blob, rootName + '.zip');
          showStatus('outputStatus', '已开始下载压缩包', 'success');
        });
      }
    }

    // 下载Blob
    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
