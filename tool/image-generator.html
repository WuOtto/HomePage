<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 图片生成器</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --text-secondary: #666666;
      --card-bg: #f9f9f9;
      --card-border: #dddddd;
      --button-bg: #28a745;
      --button-hover: #218838;
      --shadow: rgba(0, 0, 0, 0.1);
      --input-bg: #ffffff;
      --input-border: #dddddd;
      --chip-bg: #eeeeee;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --text-color: #ffffff;
        --text-secondary: #cccccc;
        --card-bg: #2d2d2d;
        --card-border: #555555;
        --button-bg: #28a745;
        --button-hover: #34ce57;
        --shadow: rgba(0, 0, 0, 0.3);
        --input-bg: #3a3a3a;
        --input-border: #555555;
        --chip-bg: #3f3f3f;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 30px;
      font-size: 0.95em;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 4px var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .panel h2 {
      margin: 0 0 15px 0;
      font-size: 1.1em;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.9em;
    }

    .form-group textarea,
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      font-size: 0.95em;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
      transition: border-color 0.2s ease;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--button-bg);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 5px 12px;
      border-radius: 14px;
      border: 1px solid var(--input-border);
      background: var(--chip-bg);
      color: var(--text-color);
      font-size: 0.85em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip.active {
      background: var(--button-bg);
      border-color: var(--button-bg);
      color: white;
    }

    .btn-generate {
      width: 100%;
      padding: 12px;
      background: var(--button-bg);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-generate:hover {
      background: var(--button-hover);
    }

    .btn-generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    @media (max-width: 600px) {
      .results-grid {
        grid-template-columns: 1fr;
      }
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .result-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--chip-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .result-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
    }

    .loading {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9em;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--input-border);
      border-top-color: var(--button-bg);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-error {
      text-align: center;
      padding: 20px;
      color: #dc3545;
      font-size: 0.9em;
    }

    .result-actions {
      display: flex;
      gap: 8px;
      padding: 10px;
      flex-wrap: wrap;
    }

    .result-actions button {
      flex: 1;
      min-width: 70px;
      padding: 7px 10px;
      font-size: 0.85em;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background: var(--input-bg);
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .result-actions button:hover {
      border-color: var(--button-bg);
      color: var(--button-bg);
    }

    .result-meta {
      padding: 0 10px 10px;
      color: var(--text-secondary);
      font-size: 0.78em;
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
    }

    .empty-state .icon {
      font-size: 3em;
      margin-bottom: 15px;
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .history-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .history-item {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      cursor: pointer;
      aspect-ratio: 1 / 1;
    }

    .history-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .history-item:hover .history-tip {
      opacity: 1;
    }

    .history-tip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 0.7em;
      padding: 4px 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-clear-history {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.8em;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      float: right;
    }

    .btn-clear-history:hover {
      color: #dc3545;
    }

    /* 大图预览 */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: zoom-out;
      padding: 30px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background: var(--button-bg);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .back-link:hover {
      background: var(--button-hover);
    }

    .center-footer {
      text-align: center;
    }

    @media (max-width: 768px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 2em;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AI 图片生成器</h1>
    <p class="subtitle">输入文字描述，免费生成 AI 图片（基于 Pollinations 开放接口，无需 API Key）</p>

    <div class="main-layout">
      <!-- 左侧：参数面板 -->
      <div>
        <div class="panel">
          <h2>生成参数</h2>
          <div class="form-group">
            <label for="prompt">提示词（Prompt）</label>
            <textarea id="prompt" placeholder="描述你想要的画面，例如：一只戴墨镜的橘猫坐在沙滩上，夕阳，电影感"></textarea>
          </div>
          <div class="form-group">
            <label>风格预设</label>
            <div class="chip-group" id="styleChips"></div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="ratio">画面比例</label>
              <select id="ratio">
                <option value="1024x1024">1:1（1024×1024）</option>
                <option value="896x1152">3:4（896×1152）</option>
                <option value="1152x896">4:3（1152×896）</option>
                <option value="1216x684">16:9（1216×684）</option>
              </select>
            </div>
            <div class="form-group">
              <label for="count">生成数量</label>
              <select id="count">
                <option value="1">1 张</option>
                <option value="2">2 张</option>
                <option value="4" selected>4 张</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="model">模型</label>
              <select id="model">
                <option value="flux" selected>flux（质量优先）</option>
                <option value="turbo">turbo（速度优先）</option>
              </select>
            </div>
            <div class="form-group">
              <label for="seed">Seed（留空随机）</label>
              <input type="text" id="seed" placeholder="随机" inputmode="numeric">
            </div>
          </div>
          <button class="btn-generate" id="generateBtn">生成图片</button>
        </div>

        <!-- 历史记录 -->
        <div class="panel" style="margin-top: 20px;">
          <h2 style="float: left;">历史记录</h2>
          <button class="btn-clear-history" id="clearHistoryBtn">清空</button>
          <div style="clear: both;"></div>
          <div class="history-grid" id="historyGrid"></div>
          <p id="historyEmpty" style="color: var(--text-secondary); font-size: 0.85em; margin: 10px 0 0;">暂无历史记录</p>
        </div>
      </div>

      <!-- 右侧：结果区 -->
      <div class="panel">
        <h2>生成结果</h2>
        <div class="results-grid" id="resultsGrid"></div>
        <div class="empty-state" id="emptyState">
          <div class="icon">🎨</div>
          <div>输入提示词，点击「生成图片」开始创作</div>
        </div>
      </div>
    </div>

    <div class="center-footer">
      <a href="./index.html" class="back-link">返回工具列表</a>
    </div>
  </div>

  <!-- 大图预览 -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="预览大图">
  </div>

  <script>
    // ---------- 配置 ----------
    var STYLE_PRESETS = [
      { name: '无', suffix: '' },
      { name: '照片级', suffix: ', photorealistic, ultra detailed, 8k, professional photography' },
      { name: '水彩', suffix: ', watercolor painting style, soft colors, artistic' },
      { name: '赛博朋克', suffix: ', cyberpunk style, neon lights, futuristic city, high contrast' },
      { name: '扁平插画', suffix: ', flat illustration, vector art, minimal, clean shapes' },
      { name: '3D 卡通', suffix: ', 3D cartoon style, cute, pixar style, soft lighting' },
      { name: '像素风', suffix: ', pixel art style, 16-bit retro game art' },
      { name: '中国水墨', suffix: ', traditional Chinese ink painting style, sumi-e, minimalist brush strokes' },
      { name: '动漫', suffix: ', anime style, manga art, vibrant colors, detailed illustration' },
      { name: '油画', suffix: ', oil painting style, classical art, rich textures, brush strokes' }
    ];
    var HISTORY_KEY = 'imageGenHistory';
    var HISTORY_MAX = 16;

    var currentStyleIndex = 0;
    var results = []; // 当前批次结果 {prompt, seed, url, w, h}

    // ---------- DOM ----------
    var promptEl = document.getElementById('prompt');
    var styleChipsEl = document.getElementById('styleChips');
    var ratioEl = document.getElementById('ratio');
    var countEl = document.getElementById('count');
    var modelEl = document.getElementById('model');
    var seedEl = document.getElementById('seed');
    var generateBtn = document.getElementById('generateBtn');
    var resultsGrid = document.getElementById('resultsGrid');
    var emptyState = document.getElementById('emptyState');
    var historyGrid = document.getElementById('historyGrid');
    var historyEmpty = document.getElementById('historyEmpty');
    var clearHistoryBtn = document.getElementById('clearHistoryBtn');
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightboxImg');

    // ---------- 风格预设 ----------
    STYLE_PRESETS.forEach(function (s, i) {
      var chip = document.createElement('button');
      chip.className = 'chip' + (i === 0 ? ' active' : '');
      chip.textContent = s.name;
      chip.onclick = function () {
        currentStyleIndex = i;
        styleChipsEl.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
      };
      styleChipsEl.appendChild(chip);
    });

    // ---------- 生成 ----------
    generateBtn.onclick = generate;

    promptEl.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') generate();
    });

    function buildPrompt() {
      var p = promptEl.value.trim();
      if (!p) return '';
      return p + STYLE_PRESETS[currentStyleIndex].suffix;
    }

    function generate() {
      var fullPrompt = buildPrompt();
      if (!fullPrompt) {
        promptEl.focus();
        return;
      }
      var dims = ratioEl.value.split('x');
      var w = parseInt(dims[0], 10);
      var h = parseInt(dims[1], 10);
      var count = parseInt(countEl.value, 10);
      var model = modelEl.value;
      var baseSeed = seedEl.value.trim() ? parseInt(seedEl.value.trim(), 10) : Math.floor(Math.random() * 1e9);
      if (isNaN(baseSeed) || baseSeed < 0) baseSeed = Math.floor(Math.random() * 1e9);

      results = [];
      emptyState.style.display = 'none';
      resultsGrid.innerHTML = '';

      for (var i = 0; i < count; i++) {
        var seed = baseSeed + i;
        var url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(fullPrompt) +
          '?width=' + w + '&height=' + h + '&seed=' + seed + '&model=' + model + '&nologo=true';
        results.push({ prompt: fullPrompt, seed: seed, url: url, w: w, h: h });
        createResultCard(results[i], i);
      }
    }

    function createResultCard(item, index) {
      var card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML =
        '<div class="result-img-wrap"><div class="loading"><div class="spinner"></div>生成中…</div></div>' +
        '<div class="result-actions" style="display:none;">' +
        '<button data-act="download">下载</button>' +
        '<button data-act="regen">换 seed 重生成</button>' +
        '</div>' +
        '<div class="result-meta" style="display:none;"></div>';
      resultsGrid.appendChild(card);

      var wrap = card.querySelector('.result-img-wrap');
      var actions = card.querySelector('.result-actions');
      var meta = card.querySelector('.result-meta');

      var img = new Image();
      img.alt = '生成结果';
      img.onload = function () {
        wrap.innerHTML = '';
        wrap.appendChild(img);
        actions.style.display = 'flex';
        meta.style.display = 'block';
        meta.textContent = 'seed: ' + item.seed;
        addHistory(item, img);
        checkAllDone();
      };
      img.onerror = function () {
        wrap.innerHTML = '<div class="result-error">生成失败，可能是服务繁忙<br>请点击重试</div>' +
          '<div style="padding:10px;"><button class="retry-btn" style="padding:7px 16px;border:1px solid var(--input-border);border-radius:4px;background:var(--input-bg);color:var(--text-color);cursor:pointer;">重试</button></div>';
        wrap.querySelector('.retry-btn').onclick = function () {
          item.seed = Math.floor(Math.random() * 1e9);
          item.url = item.url.replace(/seed=\d+/, 'seed=' + item.seed);
          card.remove();
          createResultCard(item, index);
        };
      };
      img.src = item.url;
    }

    function checkAllDone() {
      // 预留：所有图片完成后可触发的逻辑（如自动滚动）
    }

    // 事件委托：下载 / 重生成
    resultsGrid.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var card = btn.closest('.result-card');
      var cards = Array.prototype.slice.call(resultsGrid.querySelectorAll('.result-card'));
      var idx = cards.indexOf(card);
      var item = results[idx];
      if (!item) return;

      if (btn.dataset.act === 'download') downloadImage(item, card);
      if (btn.dataset.act === 'regen') {
        item.seed = Math.floor(Math.random() * 1e9);
        item.url = item.url.replace(/seed=\d+/, 'seed=' + item.seed);
        card.remove();
        results.splice(idx, 1, item);
        createResultCard(item, idx);
      }
      if (btn.dataset.act === undefined && btn.className === 'retry-btn') return; // 已在内部处理
    });

    function downloadImage(item, card) {
      var filename = 'ai-image-' + item.seed + '.jpg';
      fetch(item.url)
        .then(function (res) { return res.blob(); })
        .then(function (blob) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        })
        .catch(function () {
          // 兜底：新标签页打开，手动保存
          window.open(item.url, '_blank');
        });
    }

    // ---------- 历史记录 ----------
    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(list) {
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
      } catch (e) {
        // 存储满时丢弃旧的一半再试
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, Math.ceil(list.length / 2))));
        } catch (e2) { /* 放弃 */ }
      }
    }

    function addHistory(item, imgEl) {
      var list = getHistory();
      // 生成小缩略图（限制 160px，控制 localStorage 体积）
      var thumb = makeThumb(imgEl, 160);
      list.unshift({
        prompt: item.prompt,
        seed: item.seed,
        url: item.url,
        w: item.w,
        h: item.h,
        thumb: thumb
      });
      if (list.length > HISTORY_MAX) list = list.slice(0, HISTORY_MAX);
      saveHistory(list);
      renderHistory();
    }

    function makeThumb(imgEl, size) {
      try {
        var canvas = document.createElement('canvas');
        var scale = Math.min(size / imgEl.naturalWidth, size / imgEl.naturalHeight, 1);
        canvas.width = Math.max(1, Math.round(imgEl.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(imgEl.naturalHeight * scale));
        var ctx = canvas.getContext('2d');
        ctx.drawImage(imgEl, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.7);
      } catch (e) {
        return '';
      }
    }

    function renderHistory() {
      var list = getHistory();
      historyGrid.innerHTML = '';
      historyEmpty.style.display = list.length ? 'none' : 'block';
      list.forEach(function (h) {
        var div = document.createElement('div');
        div.className = 'history-item';
        var html = '';
        if (h.thumb) html += '<img src="' + h.thumb + '" alt="历史图片">';
        else html += '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.5em;">🖼️</div>';
        html += '<div class="history-tip">' + escapeHtml(h.prompt.slice(0, 40)) + '</div>';
        div.innerHTML = html;
        div.title = h.prompt + '\n(点击查看大图)';
        div.onclick = function () {
          lightboxImg.src = h.url;
          lightbox.classList.add('active');
        };
        historyGrid.appendChild(div);
      });
    }

    clearHistoryBtn.onclick = function () {
      if (confirm('确定清空全部历史记录吗？')) {
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
      }
    };

    function escapeHtml(str) {
      var d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // ---------- 大图预览 ----------
    lightbox.addEventListener('click', function () {
      lightbox.classList.remove('active');
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') lightbox.classList.remove('active');
    });

    // 结果图片点击放大（事件委托）
    resultsGrid.addEventListener('click', function (e) {
      var img = e.target.closest('.result-img-wrap img');
      if (img) {
        lightboxImg.src = img.src;
        lightbox.classList.add('active');
      }
    });

    // ---------- 初始化 ----------
    renderHistory();
  </script>
</body>

</html>
