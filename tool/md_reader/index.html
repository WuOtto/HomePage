<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown阅读器</title>
  
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --text-secondary: #666666;
      --card-bg: #f9f9f9;
      --card-border: #dddddd;
      --button-bg: #28a745;
      --button-hover: #218838;
      --code-bg: #f5f5f5;
      --code-color: #555555;
      --pre-bg: #f8f9fa;
      --link-color: #0366d6;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --text-color: #ffffff;
        --text-secondary: #cccccc;
        --card-bg: #2d2d2d;
        --card-border: #555555;
        --button-bg: #28a745;
        --button-hover: #34ce57;
        --code-bg: #2d2d2d;
        --code-color: #e6e6e6;
        --pre-bg: #2d2d2d;
        --link-color: #58a6ff;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
      line-height: 1.6;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--text-color);
      margin-top: 24px;
      margin-bottom: 16px;
    }

    p {
      margin-bottom: 16px;
      color: var(--text-color);
    }

    code {
      font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
      background-color: var(--code-bg);
      color: var(--code-color);
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 85%;
    }

    pre {
      background-color: var(--pre-bg);
      border-radius: 6px;
      padding: 16px;
      overflow: auto;
      margin-bottom: 16px;
    }

    pre > code {
      background-color: transparent;
      padding: 0;
      font-size: 85%;
      color: var(--code-color);
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .upload-container {
      text-align: center;
      margin: 40px 0;
    }

    .upload-btn {
      display: inline-block;
      padding: 10px 20px;
      background: var(--button-bg);
      color: white;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
      border: none;
    }

    .upload-btn:hover {
      background: var(--button-hover);
    }

    .alert-danger {
      color: #721c24;
      background-color: #f8d7da;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      display: none;
    }

    .alert-danger:not(:empty) {
      display: block;
    }

    .drag-info {
      color: var(--text-secondary);
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="upload-container">
    <h1>Markdown阅读器</h1>
    <p>上传或拖放Markdown文件到此处查看</p>
    <input type="file" id="upload-btn" accept=".md,.txt" class="upload-btn"></input>
    <p class="drag-info">或将文件拖放到页面任意位置</p>
    <div id="alert-when-upload" class="alert-danger"></div>
  </div>
</body>

<script>
"use strict";

const uploadBtn       = $query('#upload-btn');
const alertWhenUpload = $query("#alert-when-upload");
const body            = $query("body");

uploadBtn.addEventListener('change', event => {
  alertWhenUpload.innerText = "";
  const file = event.target.files[0];
  handleFile(file);
});

async function handleFile(file) {
  if (!file) return;
  try {
    // https://developer.mozilla.org/en-US/docs/Web/API/Blob/text
    const md = await file.text();
    const dirty = marked.parse(md);
    const clean = DOMPurify.sanitize(dirty);
    body.innerHTML = clean;
  } catch (error) {
      alertWhenUpload.innerText = "出错： " + error;
  }
}

function $query(selectors) {
  return document.querySelector(selectors);
}

// https://developer.mozilla.org/en-US/docs/Web/API/File_API/Using_files_from_web_applications
const dropbox = $query("html");
dropbox.addEventListener("dragenter", dragenter, false);
dropbox.addEventListener("dragover", dragover, false);
dropbox.addEventListener("drop", drop, false);

function drop(e) {
  e.stopPropagation();
  e.preventDefault();
  handleFile(e.dataTransfer.files[0]);
}

function dragenter(e) {
  e.stopPropagation();
  e.preventDefault();
}

function dragover(e) {
  e.stopPropagation();
  e.preventDefault();
}
</script>
</html>
