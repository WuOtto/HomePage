<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON格式化工具</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --text-secondary: #666666;
      --card-bg: #f9f9f9;
      --card-border: #dddddd;
      --button-bg: #28a745;
      --button-hover: #218838;
      --button-secondary: #6c757d;
      --button-secondary-hover: #5a6268;
      --shadow: rgba(0, 0, 0, 0.1);
      --input-bg: #ffffff;
      --input-border: #dddddd;
      --error-color: #dc3545;
      --success-color: #28a745;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --text-color: #ffffff;
        --text-secondary: #cccccc;
        --card-bg: #2d2d2d;
        --card-border: #555555;
        --button-bg: #28a745;
        --button-hover: #34ce57;
        --button-secondary: #6c757d;
        --button-secondary-hover: #868e96;
        --shadow: rgba(0, 0, 0, 0.3);
        --input-bg: #3a3a3a;
        --input-border: #555555;
        --error-color: #dc3545;
        --success-color: #28a745;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      color: var(--text-color);
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 20px;
      font-size: 0.95em;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      color: white;
    }

    .btn-primary {
      background: var(--button-bg);
    }

    .btn-primary:hover {
      background: var(--button-hover);
    }

    .btn-secondary {
      background: var(--button-secondary);
    }

    .btn-secondary:hover {
      background: var(--button-secondary-hover);
    }

    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .editor-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 4px var(--shadow);
    }

    .editor-panel h2 {
      margin: 0 0 10px 0;
      font-size: 1.1em;
      color: var(--text-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-panel textarea {
      width: 100%;
      height: 500px;
      padding: 12px;
      font-size: 0.9em;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
      resize: vertical;
      line-height: 1.5;
    }

    .editor-panel textarea:focus {
      outline: none;
      border-color: var(--button-bg);
    }

    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9em;
      display: none;
    }

    .status.error {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid var(--error-color);
      color: var(--error-color);
      display: block;
    }

    .status.success {
      background: rgba(40, 167, 69, 0.1);
      border: 1px solid var(--success-color);
      color: var(--success-color);
      display: block;
    }

    .copy-btn-small {
      padding: 4px 12px;
      background: var(--button-bg);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 0.85em;
      cursor: pointer;
    }

    .copy-btn-small:hover {
      background: var(--button-hover);
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: var(--button-bg);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .back-link:hover {
      background: var(--button-hover);
    }

    @media (max-width: 1024px) {
      .editor-container {
        grid-template-columns: 1fr;
      }

      .editor-panel textarea {
        height: 300px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 2em;
      }

      .controls {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>JSON格式化工具</h1>
    <p class="subtitle">格式化、压缩、验证JSON数据</p>

    <div class="controls">
      <button class="btn btn-primary" onclick="formatJSON()">格式化</button>
      <button class="btn btn-primary" onclick="compressJSON()">压缩</button>
      <button class="btn btn-secondary" onclick="validateJSON()">验证</button>
      <button class="btn btn-secondary" onclick="clearAll()">清空</button>
    </div>

    <div class="editor-container">
      <div class="editor-panel">
        <h2>
          输入
          <button class="copy-btn-small" onclick="copyInput()">复制</button>
        </h2>
        <textarea id="inputJSON" placeholder='输入JSON数据，例如：{"name":"张三","age":25}'></textarea>
        <div class="status" id="inputStatus"></div>
      </div>

      <div class="editor-panel">
        <h2>
          输出
          <button class="copy-btn-small" onclick="copyOutput()">复制</button>
        </h2>
        <textarea id="outputJSON" placeholder="格式化后的JSON将显示在这里" readonly></textarea>
        <div class="status" id="outputStatus"></div>
      </div>
    </div>

    <div style="text-align: center;">
      <a href="./index.html" class="back-link">返回工具列表</a>
    </div>
  </div>

  <script>
    // 格式化JSON
    function formatJSON() {
      const input = document.getElementById('inputJSON').value.trim();
      
      if (!input) {
        showStatus('inputStatus', '请输入JSON数据', 'error');
        return;
      }

      try {
        const parsed = JSON.parse(input);
        const formatted = JSON.stringify(parsed, null, 2);
        document.getElementById('outputJSON').value = formatted;
        showStatus('outputStatus', '格式化成功', 'success');
        hideStatus('inputStatus');
      } catch (e) {
        showStatus('inputStatus', 'JSON格式错误: ' + e.message, 'error');
        document.getElementById('outputJSON').value = '';
      }
    }

    // 压缩JSON
    function compressJSON() {
      const input = document.getElementById('inputJSON').value.trim();
      
      if (!input) {
        showStatus('inputStatus', '请输入JSON数据', 'error');
        return;
      }

      try {
        const parsed = JSON.parse(input);
        const compressed = JSON.stringify(parsed);
        document.getElementById('outputJSON').value = compressed;
        showStatus('outputStatus', '压缩成功', 'success');
        hideStatus('inputStatus');
      } catch (e) {
        showStatus('inputStatus', 'JSON格式错误: ' + e.message, 'error');
        document.getElementById('outputJSON').value = '';
      }
    }

    // 验证JSON
    function validateJSON() {
      const input = document.getElementById('inputJSON').value.trim();
      
      if (!input) {
        showStatus('inputStatus', '请输入JSON数据', 'error');
        return;
      }

      try {
        JSON.parse(input);
        showStatus('inputStatus', 'JSON格式正确 ✓', 'success');
      } catch (e) {
        showStatus('inputStatus', 'JSON格式错误: ' + e.message, 'error');
      }
    }

    // 清空
    function clearAll() {
      document.getElementById('inputJSON').value = '';
      document.getElementById('outputJSON').value = '';
      hideStatus('inputStatus');
      hideStatus('outputStatus');
    }

    // 复制输入
    function copyInput() {
      const text = document.getElementById('inputJSON').value;
      copyToClipboard(text, event.target);
    }

    // 复制输出
    function copyOutput() {
      const text = document.getElementById('outputJSON').value;
      if (!text) {
        alert('输出为空，无法复制');
        return;
      }
      copyToClipboard(text, event.target);
    }

    // 显示状态
    function showStatus(id, message, type) {
      const status = document.getElementById(id);
      status.textContent = message;
      status.className = 'status ' + type;
    }

    // 隐藏状态
    function hideStatus(id) {
      const status = document.getElementById(id);
      status.className = 'status';
    }

    // 复制到剪贴板
    function copyToClipboard(text, btn) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => {
            if (btn) {
              const originalText = btn.textContent;
              btn.textContent = '已复制';
              setTimeout(() => {
                btn.textContent = originalText;
              }, 1500);
            }
          })
          .catch(() => fallbackCopy(text, btn));
      } else {
        fallbackCopy(text, btn);
      }
    }

    // 备用复制方案
    function fallbackCopy(text, btn) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      document.body.appendChild(textArea);
      textArea.select();
      
      try {
        document.execCommand('copy');
        if (btn) {
          const originalText = btn.textContent;
          btn.textContent = '已复制';
          setTimeout(() => {
            btn.textContent = originalText;
          }, 1500);
        }
      } catch (err) {
        console.error('复制失败:', err);
      }
      
      document.body.removeChild(textArea);
    }
  </script>
</body>

</html>
