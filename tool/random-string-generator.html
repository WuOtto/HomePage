<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机字符串生成器</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --text-secondary: #666666;
      --card-bg: #f9f9f9;
      --card-border: #dddddd;
      --button-bg: #28a745;
      --button-hover: #218838;
      --shadow: rgba(0, 0, 0, 0.1);
      --input-bg: #ffffff;
      --input-border: #dddddd;
      --result-bg: #e8f5e9;
      --result-border: #c3e6cb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --text-color: #ffffff;
        --text-secondary: #cccccc;
        --card-bg: #2d2d2d;
        --card-border: #555555;
        --button-bg: #28a745;
        --button-hover: #34ce57;
        --shadow: rgba(0, 0, 0, 0.3);
        --input-bg: #3a3a3a;
        --input-border: #555555;
        --result-bg: #1e4620;
        --result-border: #2d5f2e;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      color: var(--text-color);
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 30px;
      font-size: 0.95em;
    }

    .calculator-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 4px var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .calculator-card h2 {
      margin: 0 0 15px 0;
      color: var(--text-color);
      font-size: 1.1em;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .form-group input[type="number"],
    .form-group input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 0.95em;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--button-bg);
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .checkbox-item label {
      margin: 0;
      cursor: pointer;
      color: var(--text-color);
    }

    .btn-generate {
      width: 100%;
      padding: 12px;
      background: var(--button-bg);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-bottom: 10px;
    }

    .btn-generate:hover {
      background: var(--button-hover);
    }

    .result-box {
      background: var(--result-bg);
      border: 1px solid var(--result-border);
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 10px;
      word-break: break-all;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      font-size: 1.1em;
      line-height: 1.6;
      min-height: 60px;
      display: flex;
      align-items: center;
      color: var(--text-color);
    }

    .result-actions {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 10px;
      background: var(--button-bg);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-action:hover {
      background: var(--button-hover);
    }

    .batch-results {
      max-height: 400px;
      overflow-y: auto;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 4px;
      padding: 15px;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      font-size: 0.9em;
      line-height: 1.8;
    }

    .batch-results div {
      padding: 5px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .batch-results div:last-child {
      border-bottom: none;
    }

    .strength-meter {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 0.9em;
      display: none;
    }

    .strength-meter.show {
      display: block;
    }

    .strength-weak {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid #dc3545;
      color: #dc3545;
    }

    .strength-medium {
      background: rgba(255, 193, 7, 0.1);
      border: 1px solid #ffc107;
      color: #ffc107;
    }

    .strength-strong {
      background: rgba(40, 167, 69, 0.1);
      border: 1px solid #28a745;
      color: #28a745;
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background: var(--button-bg);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .back-link:hover {
      background: var(--button-hover);
    }

    @media (max-width: 768px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 2em;
      }

      .result-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>随机字符串生成器</h1>
    <p class="subtitle">生成密码、Token、随机字符串等</p>

    <!-- 配置 -->
    <div class="calculator-card">
      <h2>生成配置</h2>
      
      <div class="form-group">
        <label>字符串长度</label>
        <input type="number" id="length" value="16" min="1" max="10000">
      </div>

      <div class="form-group">
        <label>字符类型</label>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="uppercase" checked>
            <label for="uppercase">大写字母 (A-Z)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="lowercase" checked>
            <label for="lowercase">小写字母 (a-z)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="numbers" checked>
            <label for="numbers">数字 (0-9)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="symbols">
            <label for="symbols">特殊符号 (!@#$%^&*)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="chinese">
            <label for="chinese">中文汉字 (常用3500字)</label>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>生成数量</label>
        <input type="number" id="count" value="1" min="1" max="100">
      </div>

      <button class="btn-generate" onclick="generateStrings()">生成</button>
    </div>

    <!-- 结果 -->
    <div class="calculator-card">
      <h2>生成结果</h2>
      <div class="result-box" id="result">点击生成按钮开始</div>
      <div class="strength-meter" id="strengthMeter"></div>
      <div class="result-actions">
        <button class="btn-action" onclick="copyResult()">复制</button>
        <button class="btn-action" onclick="generateStrings()">重新生成</button>
      </div>
    </div>

    <!-- 批量结果 -->
    <div class="calculator-card" id="batchCard" style="display: none;">
      <h2>批量结果</h2>
      <div class="batch-results" id="batchResults"></div>
      <div class="result-actions" style="margin-top: 15px;">
        <button class="btn-action" onclick="copyBatchResults()">复制全部</button>
      </div>
    </div>

    <div style="text-align: center;">
      <a href="./index.html" class="back-link">返回工具列表</a>
    </div>
  </div>

  <script>
    // 生成随机字符串
    function generateStrings() {
      const length = parseInt(document.getElementById('length').value);
      const count = parseInt(document.getElementById('count').value);
      
      // 验证输入
      if (length < 1 || length > 10000) {
        alert('长度必须在 1-10000 之间');
        return;
      }
      
      if (count < 1 || count > 100) {
        alert('数量必须在 1-100 之间');
        return;
      }

      // 获取字符集
      const charset = getCharset();
      if (charset.length === 0) {
        alert('请至少选择一种字符类型');
        return;
      }

      // 生成字符串
      const results = [];
      for (let i = 0; i < count; i++) {
        results.push(generateRandomString(length, charset));
      }

      // 显示结果
      if (count === 1) {
        document.getElementById('result').textContent = results[0];
        document.getElementById('batchCard').style.display = 'none';
        
        // 只有不包含中文时才显示密码强度
        if (!document.getElementById('chinese').checked) {
          showPasswordStrength(results[0]);
        } else {
          document.getElementById('strengthMeter').classList.remove('show');
        }
      } else {
        document.getElementById('result').textContent = `已生成 ${count} 个随机字符串`;
        document.getElementById('batchResults').innerHTML = results.map(r => `<div>${r}</div>`).join('');
        document.getElementById('batchCard').style.display = 'block';
        document.getElementById('strengthMeter').classList.remove('show');
      }
    }

    // 常用中文汉字（3500个常用字）
    const commonChineseChars = '的一是在不了有和人这中大为上个国我以要他时来用们生到作地于出就分对成会可主发年动同工也能下过子说产种面而方后多定行学法所民得经十三之进着等部度家电力里如水化高自二理起小物现实加量都两体制机当使点从业本去把性好应开它合还因由其些然前外天政四日那社义事平形相全表间样与关各重新线内数正心反你明看原又么利比或但质气第向道命此变条只没结解问意建月公无系军很情者最立代想已通并提直题党程展五果料象员革位入常文总次品式活设及管特件长求老头基资边流路级少图山统接知较将组见计别她手角期根论运农指几九区强放决西被干做必战先回则任取据处队南给色光门即保治北造百规热领七海口东导器压志世金增争济阶油思术极交受联什认六共权收证改清己美再采转更单风切打白教速花带安场身车例真务具万每目至达走积示议声报斗完类八离华名确才科张信马节话米整空元况今集温传土许步群广石记需段研界拉林律叫且究观越织装影算低持音众书布复容儿须际商非验连断深难近矿千周委素技备半办青省列习响约支般史感劳便团往酸历市克何除消构府称太准精值号率族维划选标写存候毛亲快效斯院查江型眼王按格养易置派层片始却专状育厂京识适属圆包火住调满县局照参红细引听该铁价严龙飞';

    // 获取字符集
    function getCharset() {
      let charset = '';
      
      if (document.getElementById('uppercase').checked) {
        charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      }
      if (document.getElementById('lowercase').checked) {
        charset += 'abcdefghijklmnopqrstuvwxyz';
      }
      if (document.getElementById('numbers').checked) {
        charset += '0123456789';
      }
      if (document.getElementById('symbols').checked) {
        charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';
      }
      if (document.getElementById('chinese').checked) {
        charset += commonChineseChars;
      }
      
      return charset;
    }

    // 生成随机字符串
    function generateRandomString(length, charset) {
      let result = '';
      const charsetLength = charset.length;
      
      // 使用 crypto.getRandomValues 生成更安全的随机数
      const randomValues = new Uint32Array(length);
      crypto.getRandomValues(randomValues);
      
      for (let i = 0; i < length; i++) {
        result += charset[randomValues[i] % charsetLength];
      }
      
      return result;
    }

    // 显示密码强度
    function showPasswordStrength(password) {
      const strength = calculatePasswordStrength(password);
      const meter = document.getElementById('strengthMeter');
      
      meter.classList.remove('strength-weak', 'strength-medium', 'strength-strong');
      
      if (strength.score < 40) {
        meter.className = 'strength-meter show strength-weak';
        meter.textContent = `密码强度：弱 (${strength.score}分) - ${strength.feedback}`;
      } else if (strength.score < 70) {
        meter.className = 'strength-meter show strength-medium';
        meter.textContent = `密码强度：中 (${strength.score}分) - ${strength.feedback}`;
      } else {
        meter.className = 'strength-meter show strength-strong';
        meter.textContent = `密码强度：强 (${strength.score}分) - ${strength.feedback}`;
      }
    }

    // 计算密码强度
    function calculatePasswordStrength(password) {
      let score = 0;
      const feedback = [];
      
      // 长度评分
      if (password.length >= 8) score += 20;
      if (password.length >= 12) score += 10;
      if (password.length >= 16) score += 10;
      
      // 字符类型评分
      if (/[a-z]/.test(password)) {
        score += 15;
        feedback.push('包含小写字母');
      }
      if (/[A-Z]/.test(password)) {
        score += 15;
        feedback.push('包含大写字母');
      }
      if (/[0-9]/.test(password)) {
        score += 15;
        feedback.push('包含数字');
      }
      if (/[^a-zA-Z0-9]/.test(password)) {
        score += 15;
        feedback.push('包含特殊符号');
      }
      
      return {
        score: Math.min(score, 100),
        feedback: feedback.join('、')
      };
    }

    // 复制结果
    function copyResult() {
      const text = document.getElementById('result').textContent;
      if (text === '点击生成按钮开始' || text.startsWith('已生成')) {
        alert('请先生成字符串');
        return;
      }
      copyToClipboard(text, event.target);
    }

    // 复制批量结果
    function copyBatchResults() {
      const results = Array.from(document.querySelectorAll('#batchResults div'))
        .map(div => div.textContent)
        .join('\n');
      copyToClipboard(results, event.target);
    }

    // 复制到剪贴板
    function copyToClipboard(text, btn) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => {
            const originalText = btn.textContent;
            btn.textContent = '已复制';
            setTimeout(() => {
              btn.textContent = originalText;
            }, 1500);
          })
          .catch(() => fallbackCopy(text, btn));
      } else {
        fallbackCopy(text, btn);
      }
    }

    // 备用复制方案
    function fallbackCopy(text, btn) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      document.body.appendChild(textArea);
      textArea.select();
      
      try {
        document.execCommand('copy');
        const originalText = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(() => {
          btn.textContent = originalText;
        }, 1500);
      } catch (err) {
        console.error('复制失败:', err);
      }
      
      document.body.removeChild(textArea);
    }
  </script>
</body>

</html>
